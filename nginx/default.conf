server {
    listen 80;
    server_name _;

    client_max_body_size 20M;

    # Let's Encrypt HTTP-01 校验，certbot申请/续期证书用
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # API reverse proxy
    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # Health check endpoint
    location /health {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # WebSocket proxy
    location /api/v1/chat/ws/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # OpenKF SPI (no JWT, AES envelope)
    location /open-kf/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend static files (SPA)
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # SPA fallback - try files, fall back to index
        proxy_intercept_errors on;
        error_page 404 = /index.html;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name lxy887.icu;

    client_max_body_size 20M;

    ssl_certificate /etc/letsencrypt/live/lxy887.icu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lxy887.icu/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # API reverse proxy
    location /api/ {
        proxy_pass http://backend;
